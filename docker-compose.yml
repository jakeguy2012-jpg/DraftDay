services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: draftiq, POSTGRES_PASSWORD: draftiq, POSTGRES_DB: draftiq }
    volumes: [draftiq-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U draftiq"], interval: 5s, timeout: 3s, retries: 10 }
  web:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { draftiq-data: {} }
